<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>The Puzzle Sanctuary — Clue 3 Index</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    /* Full-page black background and card styling without clickable links */
    html,body{height:100%;margin:0;background:#000;font-family: Arial, Helvetica, sans-serif;color:#fff}
    .wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:36px}
    .card{width:1100px;background:#000;color:#fff;padding:28px 36px;border:0;box-shadow:0 10px 30px rgba(0,0,0,0.35);position:relative}
    h1{font-size:36px;margin:0 0 22px;font-weight:700;text-transform:uppercase}
    ol{margin:10px 0 60px 18px;padding:0;color:#fff}
    ol li{margin:14px 0;font-size:18px}
    /* make list items plain text (not clickable) */
    .clue-text{color:#fff;text-decoration:underline dotted #999;font-style:italic;cursor:default}
    .coming{color:#f3b0b0;text-decoration:underline dotted #b33;font-style:italic;cursor:default}

    /* header-star inside card, top-right */
    .card .header-star{position:absolute;top:-28px;right:-28px;width:220px;height:110px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0b6b79;color:#fff;padding:8px;clip-path:polygon(50% 0%, 63% 25%, 100% 12%, 80% 48%, 100% 82%, 62% 75%, 50% 100%, 37% 75%, 0% 82%, 20% 48%, 0% 12%, 37% 25%);box-shadow:0 6px 18px rgba(0,0,0,0.2)}
    .card .header-star .line-1{font-size:16px;text-decoration:underline}
    .card .header-star .line-2{font-size:12px}

    /* bottom nav as plain text */
    .nav{position:absolute;right:26px;bottom:18px;font-size:16px;color:#00a2ff}
    .nav .nav-item{display:inline-block;margin-left:10px;color:#00a2ff;text-decoration:underline}
    .nav .page{color:#ddd;margin-left:8px;margin-right:8px}

    @media (max-width:1200px){ .card{width:calc(100% - 72px)} }
    @media (max-width:520px){ .card{padding:18px} h1{font-size:24px} ol li{font-size:16px} .card .header-star{display:none} }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="header-star" aria-hidden="true">
        <span class="line-1">DXH's</span>
        <span class="line-2">Sample Website</span>
      </div>

      <h1>THE PUZZLE SANCTUARY</h1>

      <ol>
        <li><strong>#11. </strong><span class="clue-text">1. locate the missive and perceive the stratagems.</span></li>
        <li><strong>#12. </strong><span class="coming">2. coming soon</span></li>
        <li><strong>#13. </strong><span class="coming">3. coming soon</span></li>
        <li><strong>#14. </strong><span class="coming">4. coming soon</span></li>
        <li><strong>#15. </strong><span class="coming">5. coming soon</span></li>
      </ol>

      <div class="nav" aria-hidden="true">
        <span class="nav-item">&lt;- back</span>
        <span class="page">page 2/2</span>
        <span class="nav-item">next -></span>
      </div>
    </div>
  </div>
</body>
</html>
